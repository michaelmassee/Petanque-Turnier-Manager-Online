def envQuoteValue = { Object raw ->
    def value = (raw ?: '').toString()
    '"' + value
        .replace('\\', '\\\\')
        .replace('"', '\\"')
        .replace('\r', '\\r')
        .replace('\n', '\\n') + '"'
}

