tasks.register('localTest') {
    group = 'verification'
    description = 'Fuehrt lokale Checks aus: PHP-Syntax, Laravel-Tests falls installiert, Frontend-Build'
    dependsOn 'buildAssets'

    doLast {
        def runLocalCommand = { List<String> command ->
            def process = new ProcessBuilder(command)
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
            def output = new ByteArrayOutputStream()
            process.inputStream.transferTo(output)
            def exitCode = process.waitFor()
            [exitCode: exitCode, output: output.toString('UTF-8').trim()]
        }

        def phpFiles = fileTree(projectDir) {
            include '**/*.php'
            exclude 'vendor/**'
            exclude 'node_modules/**'
            exclude 'storage/**'
            exclude 'bootstrap/cache/**'
            exclude 'build/**'
        }.files.sort { it.path }

        println "→ Prüfe PHP-Syntax (${phpFiles.size()} Dateien) …"
        def syntaxErrors = []
        phpFiles.each { phpFile ->
            def result = runLocalCommand(['php', '-l', phpFile.absolutePath])

            if (result.exitCode != 0) {
                syntaxErrors << result.output
            }
        }

        if (syntaxErrors) {
            throw new GradleException("PHP-Syntaxprüfung fehlgeschlagen:\n" + syntaxErrors.join('\n'))
        }
        println '✓ PHP-Syntax ist sauber.'

        if (file('vendor/bin/phpunit').exists()) {
            println '→ Starte Laravel/PHPUnit-Tests …'
            def result = runLocalCommand(['composer', 'test'])
            if (result.output) {
                println result.output
            }
            if (result.exitCode != 0) {
                throw new GradleException('Laravel/PHPUnit-Tests fehlgeschlagen.')
            }
        } else {
            println '↷ Laravel/PHPUnit-Tests übersprungen: vendor/bin/phpunit fehlt. Dev-Abhängigkeiten mit composer install installieren.'
        }

        println '✓ Lokale Checks abgeschlossen.'
    }
}

tasks.register('localDev') {
    group = 'application'
    description = 'Startet lokale Laravel- und Vite-Dev-Server mit Live-Reload'

    doLast {
        def devHost = (findProperty('localDevHost') ?: '0.0.0.0').toString()
        def devPublicHost = (findProperty('localDevPublicHost') ?: '192.168.178.46').toString()
        def laravelPort = (findProperty('localDevLaravelPort') ?: '8000').toString()
        def vitePort = (findProperty('localDevVitePort') ?: '5173').toString()
        def commands = [
            [name: 'laravel', command: ['php', 'artisan', 'serve', "--host=${devHost}", "--port=${laravelPort}"], env: [:]],
            [name: 'vite', command: ['npm', 'run', 'dev'], env: [VITE_DEV_HOST: devPublicHost, VITE_DEV_PORT: vitePort]],
        ]

        def processes = []
        def shutdown = {
            processes.each { item ->
                if (item.process.isAlive()) {
                    item.process.destroy()
                    if (!item.process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)) {
                        item.process.destroyForcibly()
                    }
                }
            }
        }

        Runtime.runtime.addShutdownHook(new Thread(shutdown))

        try {
            commands.each { item ->
                def command = item.command.collect { it.toString() }
                println "→ Starte ${item.name}: ${command.join(' ')}"
                def builder = new ProcessBuilder(command)
                    .directory(projectDir)
                    .inheritIO()
                builder.environment().putAll(item.env)
                def process = builder.start()
                processes << [name: item.name, process: process]
            }

            println ''
            println "✓ Lokale Entwicklung läuft lokal: http://localhost:${laravelPort}"
            println "✓ Im lokalen Netzwerk: http://${devPublicHost}:${laravelPort}"
            println '  Vite aktualisiert Blade/CSS/JS-Aenderungen automatisch. Stoppen mit Ctrl+C.'

            while (processes.every { it.process.isAlive() }) {
                Thread.sleep(1000)
            }

            def stopped = processes.find { !it.process.isAlive() }
            def exitCode = stopped.process.exitValue()
            shutdown()

            if (exitCode != 0) {
                throw new GradleException("${stopped.name} wurde mit Exit-Code ${exitCode} beendet.")
            }
        } finally {
            shutdown()
        }
    }
}

