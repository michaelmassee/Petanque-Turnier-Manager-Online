def remoteUser     = findProperty('remoteUser')     ?: findProperty('sftpUser')        ?: 'deploy'
def remotePassword = findProperty('remotePassword') ?: findProperty('sftpPassword')    ?: ''
def configuredRemotePath = findProperty('remotePath') ?: findProperty('sftpRemotePath') ?: '/var/www/html/petanque-turnier'
def remotePath     = configuredRemotePath == '/' ? '/' : configuredRemotePath.replaceAll('/+$', '')
def remoteUploadPath = remotePath == '/' ? '.' : remotePath
def remoteChildPath  = { String child -> remoteUploadPath == '.' ? child : "${remoteUploadPath}/${child}" }
def configuredRemoteShellPath = findProperty('remoteShellPath') ?: remotePath
def remoteShellPath = configuredRemoteShellPath == '/' ? '/' : configuredRemoteShellPath.replaceAll('/+$', '')
def remoteRunArtisan = (findProperty('remoteRunArtisan') ?: 'false').toString().toBoolean()
def shellQuote = { String value -> "'" + value.replace("'", "'\"'\"'") + "'" }
