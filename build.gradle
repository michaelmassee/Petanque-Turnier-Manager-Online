tasks.register('setRemoteAppUrl') {
    group       = 'deploy'
    description = 'Setzt APP_URL in der Remote-.env auf installerAppUrl'

    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('setRemoteAppUrl unterstützt aktuell nur SFTP.')
        }

        def appUrl = (findProperty('installerAppUrl') ?: '').toString().trim()
        if (!appUrl) {
            throw new GradleException('installerAppUrl muss gesetzt sein.')
        }

        def localEnv = layout.buildDirectory.file('remote-logs/env-app-url.txt').get().asFile
        downloadSftpFile(remoteChildPath('.env'), localEnv)
        def envText = localEnv.getText('UTF-8')
        def line = 'APP_URL=' + envQuoteValue(appUrl)
        if (envText.readLines().any { it.startsWith('APP_URL=') }) {
            envText = envText.replaceFirst('(?m)^APP_URL=.*$') { line }
        } else {
            envText = envText + (envText.endsWith('\n') ? '' : '\n') + line + '\n'
        }
        localEnv.setText(envText, 'UTF-8')

        def jsch = new JSch()
        def session = jsch.getSession(remoteUser, remoteHost, remotePort)
        session.setPassword(remotePassword)
        session.setConfig('StrictHostKeyChecking', 'no')
        session.connect(30000)

        def channel = (ChannelSftp) session.openChannel('sftp')
        channel.connect(30000)
        try {
            channel.put(localEnv.absolutePath, remoteChildPath('.env'), ChannelSftp.OVERWRITE)
            println "APP_URL wurde auf ${appUrl} gesetzt."
        } finally {
            channel.disconnect()
            session.disconnect()
        }
    }
}

