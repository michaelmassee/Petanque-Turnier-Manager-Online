    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('deployVendor unterstützt aktuell nur SFTP.')
        }

        println '→ Lade vendor/ direkt hoch (SFTP) …'
        uploadSftpTree(file('vendor'), remoteChildPath('vendor'))
        println "✓ vendor/ direkt hochgeladen → ${remoteChildPath('vendor')}"
    }
}

tasks.register('verifyRemoteVendor') {
    group       = 'deploy'
    description = 'Prüft, ob eine zentrale Laravel-Datei in vendor/ auf dem Deploy-Ziel existiert'

    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('verifyRemoteVendor unterstützt aktuell nur SFTP.')
        }

        def healthFile = remoteChildPath('vendor/laravel/framework/src/Illuminate/Reflection/helpers.php')
        def jsch = new JSch()
        def session = jsch.getSession(remoteUser, remoteHost, remotePort)
        session.setPassword(remotePassword)
        session.setConfig('StrictHostKeyChecking', 'no')
        session.connect(30000)

        def channel = (ChannelSftp) session.openChannel('sftp')
        channel.connect(30000)
        try {
            def attrs = channel.lstat(healthFile)
            println "✓ Remote-vendor vollständig genug: ${healthFile} (${attrs.size} Bytes)"
        } finally {
            channel.disconnect()
            session.disconnect()
        }
    }
}

// ─── 5. Nur Frontend-Assets hochladen (schnelles CSS/JS-Update) ───────────────
tasks.register('deployAssets') {
    group       = 'deploy'
    description = 'Lädt nur kompilierte Frontend-Assets (public/build) hoch'
    dependsOn   'buildAssets'

    doLast {
        if (deployProtocol == 'ftp') {
            registerFtpTask()
            def assetDir = [remotePath, 'public/build'].findAll { it }.join('/')
            println '→ Lade public/build hoch (FTP) …'
            ant.ftp(server: remoteHost, port: remotePort,
                    userid: remoteUser, password: remotePassword,
                    remotedir: assetDir ?: 'public/build',
                    passive: 'yes', binary: 'yes') {
                fileset(dir: 'public/build') { include(name: '**') }
            }
        } else {
            println '→ Lade public/build hoch (SFTP) …'
            uploadSftpTree(file('public/build'), remoteChildPath('public/build'))
        }
        println '✓ Assets aktualisiert.'
    }
}
