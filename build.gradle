// ─── 4. Vollständiges Deployment (SFTP oder FTP) ─────────────────────────────
tasks.register('deploy') {
    group       = 'deploy'
    description = 'Lädt die Laravel-App hoch; Artisan per SSH nur mit remoteRunArtisan=true'
    dependsOn   'prepareDeploy'

    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('Standard-Laravel-Installation benötigt SSH/SFTP. Bitte deployProtocol=sftp verwenden.')

        } else {
            // ── SFTP-Pfad ─────────────────────────────────────────────────────
            println '→ Lösche alte Laravel-Cache-Dateien auf dem Server (SFTP) …'
            deleteRemoteLaravelCacheFiles()

            println '→ Lösche alte Migrationsdateien auf dem Server (SFTP) …'
            deleteRemoteMigrationFiles()

            println '→ Lade Anwendungscode hoch (SFTP) …'
            uploadSftpTree(deployStageDir, remoteUploadPath)

            println '→ Setze Laravel-Verzeichnisrechte auf dem Server (SFTP) …'
            setRemoteLaravelPermissions()

            if (remoteRunArtisan) {
                runRemoteLaravelInstall()
            } else {
                println '→ SSH-Artisan übersprungen (remoteRunArtisan=false).'
                println '  Auf Hostings ohne Shell-Zugriff die Installation im Browser über install.php starten.'
            }

            println ''
            println "✓ Deployment abgeschlossen → ${remotePath}"
        }
    }
}

