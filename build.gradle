plugins {
    id 'org.hidetake.ssh' version '2.11.2'
}

// ─── Verbindungsparameter aus gradle.properties ───────────────────────────────
// deployProtocol: sftp (Standard, empfohlen) oder ftp
// Alte sftpHost/sftpPort/… Properties werden als Fallback weiterhin akzeptiert.
def deployProtocol = findProperty('deployProtocol') ?: 'sftp'
def remoteHost     = findProperty('remoteHost')     ?: findProperty('sftpHost')        ?: 'localhost'
def remotePort     = (findProperty('remotePort')    ?: findProperty('sftpPort')        ?: (deployProtocol == 'ftp' ? '21' : '22')) as int
def remoteUser     = findProperty('remoteUser')     ?: findProperty('sftpUser')        ?: 'deploy'
def remotePassword = findProperty('remotePassword') ?: findProperty('sftpPassword')    ?: ''
def remotePath     = (findProperty('remotePath') ?: findProperty('sftpRemotePath') ?: '/var/www/html/petanque-turnier').replaceAll('/+$', '')

// ─── SFTP-Konfiguration ───────────────────────────────────────────────────────
ssh.settings {
    knownHosts = allowAnyHosts   // ggf. durch expliziten known_hosts-Pfad ersetzen
}

remotes {
    production {
        host     = remoteHost
        port     = remotePort
        user     = remoteUser
        password = remotePassword
    }
}

// ─── FTP-Abhängigkeit (nur für deployProtocol=ftp benötigt) ──────────────────
configurations { antFtp }

repositories { mavenCentral() }

dependencies {
    antFtp 'commons-net:commons-net:3.10.0'
    antFtp 'org.apache.ant:ant-commons-net:1.10.15'
}

// Ant-FTP-Task einmalig registrieren (verhindert "override"-Warnung bei Mehrfachaufruf)
def registerFtpTask = {
    ant.taskdef(name: 'ftp',
        classname: 'org.apache.tools.ant.taskdefs.optional.net.FTP',
        classpath: configurations.antFtp.asPath)
}

// ─── 1. Frontend-Assets bauen (Vite / Tailwind) ───────────────────────────────
tasks.register('buildAssets', Exec) {
    group       = 'build'
    description = 'Baut Frontend-Assets mit npm run build (Vite)'
    commandLine 'npm', 'run', 'build'
    workingDir  projectDir
}

// ─── 2. Composer-Abhängigkeiten für Produktion installieren ──────────────────
tasks.register('composerInstall', Exec) {
    group       = 'build'
    description = 'Installiert PHP-Pakete ohne Dev-Abhängigkeiten'
    commandLine 'composer', 'install',
                '--no-dev', '--optimize-autoloader', '--no-interaction'
    workingDir  projectDir
}

// ─── 3. Build-Schritte zusammenfassen ────────────────────────────────────────
tasks.register('prepareDeploy') {
    group       = 'deploy'
    description = 'Baut Assets + installiert Composer-Pakete (Vorbereitung Deploy)'
    dependsOn 'buildAssets', 'composerInstall'
}

// ─── 4. Vollständiges Deployment (SFTP oder FTP) ─────────────────────────────
tasks.register('deploy') {
    group       = 'deploy'
    description = 'Deployt die komplette Laravel-App per SFTP oder FTP (siehe deployProtocol)'
    dependsOn   'prepareDeploy'

    doLast {
        if (deployProtocol == 'ftp') {
            // ── FTP-Pfad ──────────────────────────────────────────────────────
            registerFtpTask()

            // FTP-Upload in zwei Tranchen: Anwendungscode zuerst, vendor/ separat.
            // vendor/ enthält tausende kleine Dateien → höhere Retry-Zahl nötig.
            def ftpBase = remotePath ?: '.'
            def ftpArgs = [server: remoteHost, port: remotePort,
                           userid: remoteUser, password: remotePassword,
                           remotedir: ftpBase, passive: 'yes', binary: 'yes',
                           retriesAllowed: '5']

            println "→ Lade Anwendungscode hoch (FTP) nach ${ftpBase} …"
            ant.ftp(ftpArgs) {
                fileset(dir: projectDir.absolutePath) {
                    include(name: 'app/**')
                    include(name: 'bootstrap/**')
                    include(name: 'config/**')
                    include(name: 'database/**')
                    include(name: 'lang/**')
                    include(name: 'resources/**')
                    include(name: 'routes/**')
                    include(name: 'public/**')
                    include(name: 'artisan')
                    include(name: 'composer.json')
                    include(name: 'composer.lock')
                }
            }

            // vendor/ in wenigen Gruppen hochladen (je ~500-900 Dateien pro FTP-Session).
            // Viele kurze Verbindungen triggern Server-seitige Rate-Limits.
            def vendorBatches = [
                // Gruppe 1: kleine Pakete + autoload (~250 Dateien)
                ['vendor/autoload.php',
                 'vendor/bin/**',
                 'vendor/brick/**',
                 'vendor/carbonphp/**',
                 'vendor/composer/**',
                 'vendor/dflydev/**',
                 'vendor/doctrine/**',
                 'vendor/dragonmantank/**',
                 'vendor/egulias/**',
                 'vendor/fruitcake/**',
                 'vendor/graham-campbell/**',
                 'vendor/guzzlehttp/**',
                 'vendor/monolog/**',
                 'vendor/phpoption/**',
                 'vendor/ralouphie/**',
                 'vendor/tijsverkoyen/**',
                 'vendor/vlucas/**',
                 'vendor/voku/**'],
                // Gruppe 2: nikic, psy, livewire (~995 Dateien)
                ['vendor/nikic/**',
                 'vendor/psy/**',
                 'vendor/livewire/**'],
                // Gruppe 3: league, nesbot (~1384 Dateien – größte Einzelgruppe)
                ['vendor/league/**',
                 'vendor/nesbot/**'],
                // Gruppe 4: nette, nunomaduro, psr, ramsey (~315 Dateien)
                ['vendor/nette/**',
                 'vendor/nunomaduro/**',
                 'vendor/psr/**',
                 'vendor/ramsey/**'],
                // Gruppe 5: symfony (~1243 Dateien)
                ['vendor/symfony/**'],
                // Gruppe 6: laravel ohne framework (~104 Dateien)
                ['vendor/laravel/prompts/**',
                 'vendor/laravel/serializable-closure/**',
                 'vendor/laravel/tinker/**'],
                // Gruppe 7: laravel/framework erste Hälfte (~900 Dateien)
                ['vendor/laravel/framework/src/Illuminate/Foundation/**',
                 'vendor/laravel/framework/src/Illuminate/Database/**',
                 'vendor/laravel/framework/src/Illuminate/Contracts/**',
                 'vendor/laravel/framework/src/Illuminate/Queue/**'],
                // Gruppe 8: laravel/framework zweite Hälfte + Rest (~900 Dateien)
                ['vendor/laravel/framework/src/Illuminate/Support/**',
                 'vendor/laravel/framework/src/Illuminate/Console/**',
                 'vendor/laravel/framework/src/Illuminate/Routing/**',
                 'vendor/laravel/framework/src/Illuminate/Http/**',
                 'vendor/laravel/framework/src/Illuminate/Cache/**',
                 'vendor/laravel/framework/src/Illuminate/View/**',
                 'vendor/laravel/framework/src/Illuminate/Auth/**',
                 'vendor/laravel/framework/src/Illuminate/Validation/**',
                 'vendor/laravel/framework/src/Illuminate/Mail/**',
                 'vendor/laravel/framework/src/Illuminate/Testing/**',
                 'vendor/laravel/framework/src/Illuminate/Notifications/**',
                 'vendor/laravel/framework/src/Illuminate/Container/**',
                 'vendor/laravel/framework/src/Illuminate/Broadcasting/**',
                 'vendor/laravel/framework/src/Illuminate/Bus/**',
                 'vendor/laravel/framework/src/Illuminate/Pagination/**',
                 'vendor/laravel/framework/src/Illuminate/Session/**',
                 'vendor/laravel/framework/src/Illuminate/Redis/**',
                 'vendor/laravel/framework/src/Illuminate/Process/**',
                 'vendor/laravel/framework/src/Illuminate/Log/**',
                 'vendor/laravel/framework/src/Illuminate/Translation/**',
                 'vendor/laravel/framework/src/Illuminate/Collections/**',
                 'vendor/laravel/framework/src/Illuminate/JsonSchema/**',
                 'vendor/laravel/framework/src/Illuminate/Filesystem/**',
                 'vendor/laravel/framework/src/Illuminate/Events/**',
                 'vendor/laravel/framework/src/Illuminate/Hashing/**',
                 'vendor/laravel/framework/src/Illuminate/Concurrency/**',
                 'vendor/laravel/framework/src/Illuminate/Cookie/**',
                 'vendor/laravel/framework/src/Illuminate/Reflection/**',
                 'vendor/laravel/framework/src/Illuminate/Pipeline/**',
                 'vendor/laravel/framework/src/Illuminate/Encryption/**',
                 'vendor/laravel/framework/src/Illuminate/Conditionable/**',
                 'vendor/laravel/framework/src/Illuminate/Macroable/**',
                 'vendor/laravel/framework/src/Illuminate/Config/**',
                 'vendor/laravel/framework/src/Illuminate/*.php',
                 'vendor/laravel/framework/src/*.php',
                 'vendor/laravel/framework/*.php',
                 'vendor/laravel/framework/*.json',
                 'vendor/laravel/framework/LICENSE.md'],
            ]

            println "→ Lade vendor/ in ${vendorBatches.size()} Gruppen hoch (FTP) …"
            vendorBatches.eachWithIndex { patterns, idx ->
                println "  · Gruppe ${idx + 1}/${vendorBatches.size()} …"
                ant.ftp(ftpArgs) {
                    fileset(dir: projectDir.absolutePath) {
                        patterns.each { p -> include(name: p) }
                    }
                }
            }
            println ''
            println '⚠  FTP-Modus: Remote-Befehle können nicht automatisch ausgeführt werden.'
            println '   Bitte nach dem Upload manuell per SSH/Konsole ausführen:'
            println "   cd ${remotePath ?: '~'} && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force"
            println ''
            println "✓ FTP-Upload abgeschlossen → ${ftpBase}"

        } else {
            // ── SFTP-Pfad ─────────────────────────────────────────────────────
            ssh.run {
                session(remotes.production) {

                    println '→ Erstelle Verzeichnisstruktur auf dem Server …'
                    execute "mkdir -p ${remotePath}/storage/framework/{cache,sessions,views,testing}"
                    execute "mkdir -p ${remotePath}/storage/logs"
                    execute "mkdir -p ${remotePath}/bootstrap/cache"

                    println '→ Lade PHP-Anwendungsverzeichnisse hoch …'
                    put from: file('app'),       into: remotePath
                    put from: file('bootstrap'), into: remotePath
                    put from: file('config'),    into: remotePath
                    put from: file('database'),  into: remotePath
                    put from: file('lang'),      into: remotePath
                    put from: file('resources'), into: remotePath
                    put from: file('routes'),    into: remotePath
                    put from: file('vendor'),    into: remotePath

                    println '→ Lade Public-Verzeichnis (inkl. Vite-Assets) hoch …'
                    put from: file('public'),    into: remotePath

                    println '→ Lade Einzeldateien hoch …'
                    put from: file('artisan'),         into: remotePath
                    put from: file('composer.json'),   into: remotePath
                    put from: file('composer.lock'),   into: remotePath

                    println '→ Setze Verzeichnisberechtigungen …'
                    execute "chmod -R 775 ${remotePath}/storage"
                    execute "chmod -R 775 ${remotePath}/bootstrap/cache"
                    execute "chmod +x    ${remotePath}/artisan"

                    println '→ Laravel-Cache neu aufbauen …'
                    execute "cd ${remotePath} && php artisan config:cache"
                    execute "cd ${remotePath} && php artisan route:cache"
                    execute "cd ${remotePath} && php artisan view:cache"

                    println '→ Datenbank-Migrationen ausführen …'
                    execute "cd ${remotePath} && php artisan migrate --force"

                    println "✓ Deployment abgeschlossen → ${remotePath}"
                }
            }
        }
    }
}

// ─── 5. Nur Frontend-Assets hochladen (schnelles CSS/JS-Update) ───────────────
tasks.register('deployAssets') {
    group       = 'deploy'
    description = 'Lädt nur kompilierte Frontend-Assets (public/build) hoch'
    dependsOn   'buildAssets'

    doLast {
        if (deployProtocol == 'ftp') {
            registerFtpTask()
            def assetDir = [remotePath, 'public/build'].findAll { it }.join('/')
            println '→ Lade public/build hoch (FTP) …'
            ant.ftp(server: remoteHost, port: remotePort,
                    userid: remoteUser, password: remotePassword,
                    remotedir: assetDir ?: 'public/build',
                    passive: 'yes', binary: 'yes') {
                fileset(dir: 'public/build') { include(name: '**') }
            }
        } else {
            ssh.run {
                session(remotes.production) {
                    println '→ Lade public/build hoch …'
                    put from: file('public/build'), into: "${remotePath}/public"
                }
            }
        }
        println '✓ Assets aktualisiert.'
    }
}
