def ensureSftpDirectory
ensureSftpDirectory = { ChannelSftp channel, String path ->
    def normalized = path?.replace('\\', '/')?.replaceAll('/+$', '')
    if (!normalized || normalized == '.') {
        return
    }

    if (normalized.startsWith('/')) {
        channel.cd('/')
    }

    normalized.split('/').findAll { it }.each { segment ->
        try {
            channel.cd(segment)
        } catch (SftpException ignored) {
            channel.mkdir(segment)
            channel.cd(segment)
        }
    }
}

def uploadSftpDirectory
uploadSftpDirectory = { ChannelSftp channel, File localDir ->
    localDir.eachFile { entry ->
        if (entry.directory) {
            ensureSftpDirectory(channel, entry.name)
            uploadSftpDirectory(channel, entry)
            channel.cd('..')
        } else {
            channel.put(entry.absolutePath, entry.name, ChannelSftp.OVERWRITE)
        }
    }
}

def uploadSftpTree = { File localDir, String remoteBase ->
    def jsch = new JSch()
    def session = jsch.getSession(remoteUser, remoteHost, remotePort)
    session.setPassword(remotePassword)
    session.setConfig('StrictHostKeyChecking', 'no')
    session.connect(30000)

    def channel = (ChannelSftp) session.openChannel('sftp')
    channel.connect(30000)
    try {
        ensureSftpDirectory(channel, remoteBase)
        uploadSftpDirectory(channel, localDir)
    } finally {
        channel.disconnect()
        session.disconnect()
    }
}

def chmodSftpTree
chmodSftpTree = { ChannelSftp channel, String path, int dirMode, int fileMode ->
    try {
        def attrs = channel.lstat(path)
        if (attrs.dir) {
            channel.chmod(dirMode, path)
            channel.ls(path).each { entry ->
                if (entry instanceof ChannelSftp.LsEntry && entry.filename != '.' && entry.filename != '..') {
                    chmodSftpTree(channel, "${path}/${entry.filename}", dirMode, fileMode)
                }
            }
        } else {
            channel.chmod(fileMode, path)
        }
    } catch (SftpException ignored) {
        // Some hosts do not allow chmod on every path; verification reports the final state.
    }
}

def setRemoteLaravelPermissions = { ->
    def writableDirs = [
        'storage',
        'storage/app',
        'storage/framework',
        'storage/framework/cache',
        'storage/framework/cache/data',
        'storage/framework/sessions',
        'storage/framework/views',
        'storage/logs',
        'bootstrap/cache',
    ]

    def jsch = new JSch()
    def session = jsch.getSession(remoteUser, remoteHost, remotePort)
    session.setPassword(remotePassword)
    session.setConfig('StrictHostKeyChecking', 'no')
    session.connect(30000)

    def channel = (ChannelSftp) session.openChannel('sftp')
    channel.connect(30000)
    try {
        writableDirs.each { dir ->
            def remoteDir = remoteChildPath(dir)
            channel.cd('/')
            ensureSftpDirectory(channel, remoteDir)
            channel.chmod(0777, '.')
        }

        channel.cd('/')
        chmodSftpTree(channel, remoteChildPath('storage'), 0777, 0666)
        channel.cd('/')
        chmodSftpTree(channel, remoteChildPath('bootstrap/cache'), 0777, 0666)
    } finally {
        channel.disconnect()
        session.disconnect()
    }
}

def verifyRemoteLaravelPermissions = { ->
    def paths = [
        'storage',
        'storage/framework',
        'storage/framework/cache',
        'storage/framework/cache/data',
        'storage/framework/sessions',
        'storage/framework/views',
        'storage/logs',
        'bootstrap/cache',
    ]

    def jsch = new JSch()
    def session = jsch.getSession(remoteUser, remoteHost, remotePort)
    session.setPassword(remotePassword)
    session.setConfig('StrictHostKeyChecking', 'no')
    session.connect(30000)

    def channel = (ChannelSftp) session.openChannel('sftp')
    channel.connect(30000)
    try {
        paths.each { path ->
            def remote = remoteChildPath(path)
            try {
                channel.cd('/')
                def attrs = channel.lstat(remote)
                def mode = Integer.toOctalString(attrs.permissions & 0777).padLeft(3, '0')
                println "${mode} ${remote}"
            } catch (SftpException ex) {
                println "fehlt ${remote}"
            }
        }
    } finally {
        channel.disconnect()
        session.disconnect()
    }
}

def deleteRemoteLaravelCacheFiles = { ->
    def cacheDirs = [
        remoteChildPath('bootstrap/cache'),
        remoteChildPath('storage/framework/cache'),
    ]
    def deleted = []
    def failed = []
    def jsch = new JSch()
    def session = jsch.getSession(remoteUser, remoteHost, remotePort)
    session.setPassword(remotePassword)
    session.setConfig('StrictHostKeyChecking', 'no')
    session.connect(30000)

    def channel = (ChannelSftp) session.openChannel('sftp')
    channel.connect(30000)
    try {
        cacheDirs.each { cacheDir ->
            channel.cd('/')
            ensureSftpDirectory(channel, cacheDir)
            channel.chmod(0775, '.')
            channel.ls('*.php').each { entry ->
                if (entry instanceof ChannelSftp.LsEntry && !entry.attrs.dir) {
                    try {
                        channel.chmod(0664, entry.filename)
                        channel.rm(entry.filename)
                        deleted << "${cacheDir}/${entry.filename}"
                        println "  gelöscht: ${cacheDir}/${entry.filename}"
                    } catch (SftpException ex) {
                        failed << "${cacheDir}/${entry.filename}: ${ex.message}"
                    }
                }
            }
        }
    } catch (SftpException ex) {
        println "  keine Laravel-Cache-Dateien gefunden"
    } finally {
        channel.disconnect()
        session.disconnect()
    }

    if (failed) {
        throw new GradleException("Laravel-Cache-Dateien konnten per SFTP nicht gelöscht werden: ${failed.join(', ')}")
    }

    if (!deleted) {
        println "  keine Laravel-Cache-Dateien zu löschen"
    }
}

def deleteRemoteMigrationFiles = { ->
    def migrationsDir = remoteChildPath('database/migrations')
    def deleted = []
    def failed = []
    def jsch = new JSch()
    def session = jsch.getSession(remoteUser, remoteHost, remotePort)
    session.setPassword(remotePassword)
    session.setConfig('StrictHostKeyChecking', 'no')
    session.connect(30000)

    def channel = (ChannelSftp) session.openChannel('sftp')
    channel.connect(30000)
    try {
        channel.cd('/')
        ensureSftpDirectory(channel, migrationsDir)
        channel.ls('*.php').each { entry ->
            if (entry instanceof ChannelSftp.LsEntry && !entry.attrs.dir) {
                try {
                    channel.rm(entry.filename)
                    deleted << "${migrationsDir}/${entry.filename}"
                    println "  gelöscht: ${migrationsDir}/${entry.filename}"
                } catch (SftpException ex) {
                    failed << "${migrationsDir}/${entry.filename}: ${ex.message}"
                }
            }
        }
    } catch (SftpException ex) {
        println "  keine alten Migrationsdateien gefunden"
    } finally {
        channel.disconnect()
        session.disconnect()
    }

    if (failed) {
        throw new GradleException("Alte Migrationsdateien konnten per SFTP nicht gelöscht werden: ${failed.join(', ')}")
    }

    if (!deleted) {
        println "  keine alten Migrationsdateien zu löschen"
    }
}

def downloadSftpFile = { String remoteFile, File localFile ->
    def jsch = new JSch()
    def session = jsch.getSession(remoteUser, remoteHost, remotePort)
    session.setPassword(remotePassword)
    session.setConfig('StrictHostKeyChecking', 'no')
    session.connect(30000)

    def channel = (ChannelSftp) session.openChannel('sftp')
    channel.connect(30000)
    try {
        localFile.parentFile.mkdirs()
        channel.get(remoteFile, localFile.absolutePath)
    } finally {
        channel.disconnect()
        session.disconnect()
    }
}

def runRemoteLaravelInstall = { ->
    ssh.run {
        session(remotes.production) {
            def cd = "cd ${shellQuote(remoteShellPath)}"
            println '→ Führe Standard-Laravel-Installation per SSH aus …'
            execute "${cd} && php artisan key:generate --force --no-interaction"
            execute "${cd} && php artisan migrate --seed --force --no-interaction"
            println '✓ Laravel-Installation per SSH abgeschlossen.'
        }
    }
}

