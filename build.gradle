tasks.register('inspectRemoteEnv') {
    group       = 'deploy'
    description = 'Prüft ungefährliche .env-Werte auf dem Deploy-Ziel'

    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('inspectRemoteEnv unterstützt aktuell nur SFTP.')
        }

        def localEnv = layout.buildDirectory.file('remote-logs/env-inspect.txt').get().asFile
        downloadSftpFile(remoteChildPath('.env'), localEnv)
        def values = [:]
        localEnv.eachLine { line ->
            def trimmed = line.trim()
            if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) {
                return
            }
            def parts = trimmed.split('=', 2)
            values[parts[0]] = parts.length > 1 ? parts[1].replaceAll(/^"|"$/, '') : ''
        }

        println "APP_ENV=${values.APP_ENV ?: '(fehlt)'}"
        println "APP_DEBUG=${values.APP_DEBUG ?: '(fehlt)'}"
        println "APP_URL=${values.APP_URL ?: '(fehlt)'}"
        println "APP_KEY gesetzt=${values.APP_KEY ? 'ja' : 'nein'}"
        println "DB_CONNECTION=${values.DB_CONNECTION ?: '(fehlt)'}"
        println "LARAVEL_STORAGE_PATH=${values.LARAVEL_STORAGE_PATH ? 'gesetzt' : 'nicht gesetzt'}"
        println "APP_CONFIG_CACHE=${values.APP_CONFIG_CACHE ? 'gesetzt' : 'nicht gesetzt'}"
        println "VIEW_COMPILED_PATH=${values.VIEW_COMPILED_PATH ? 'gesetzt' : 'nicht gesetzt'}"
    }
}

tasks.register('repairRemoteAppKey') {
    group       = 'deploy'
    description = 'Setzt APP_KEY in der Remote-.env, falls er fehlt'

    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('repairRemoteAppKey unterstützt aktuell nur SFTP.')
        }

        def localEnv = layout.buildDirectory.file('remote-logs/env-repair.txt').get().asFile
        downloadSftpFile(remoteChildPath('.env'), localEnv)
        def envText = localEnv.getText('UTF-8')

        def currentKey = ''
        envText.eachLine { line ->
            if (line.startsWith('APP_KEY=')) {
                currentKey = line.substring('APP_KEY='.length()).trim()
            }
        }

        if (currentKey) {
            println 'APP_KEY ist bereits gesetzt.'
            return
        }

        def random = new byte[32]
        new SecureRandom().nextBytes(random)
        def key = 'base64:' + random.encodeBase64().toString()
        if (envText.readLines().any { it.startsWith('APP_KEY=') }) {
            envText = envText.replaceFirst('(?m)^APP_KEY=.*$') { 'APP_KEY=' + key }
        } else {
            envText = envText + (envText.endsWith('\n') ? '' : '\n') + 'APP_KEY=' + key + '\n'
        }
        localEnv.setText(envText, 'UTF-8')

        def jsch = new JSch()
        def session = jsch.getSession(remoteUser, remoteHost, remotePort)
        session.setPassword(remotePassword)
        session.setConfig('StrictHostKeyChecking', 'no')
        session.connect(30000)

        def channel = (ChannelSftp) session.openChannel('sftp')
        channel.connect(30000)
        try {
            channel.put(localEnv.absolutePath, remoteChildPath('.env'), ChannelSftp.OVERWRITE)
            println 'APP_KEY wurde in der Remote-.env gesetzt.'
        } finally {
            channel.disconnect()
            session.disconnect()
        }
    }
}

