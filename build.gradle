// ─── 3. Build-Schritte zusammenfassen ────────────────────────────────────────
tasks.register('prepareRuntimeSkeleton', Sync) {
    group       = 'deploy'
    description = 'Erstellt eine saubere Laravel-Laufzeitverzeichnisstruktur für den Upload'
    into runtimeSkeletonDir
    includeEmptyDirs = true

    from('storage') {
        into 'storage'
        include 'app/**'
        include 'framework/cache/**'
        include 'framework/sessions/**'
        include 'framework/testing/**'
        include 'framework/views/**'
        include 'logs/**'
        exclude 'framework/cache/*.php'
        exclude 'framework/cache/**/*.php'
    }
}

tasks.register('prepareDeployUpload', Sync) {
    group       = 'deploy'
    description = 'Erstellt den Upload-Stand mit Installer-Passwort aus gradle.properties'
    dependsOn 'buildAssets', 'prepareRuntimeSkeleton'
    into deployStageDir
    includeEmptyDirs = true
    inputs.properties(installerTokens)

    doFirst {
        if (!installerPassword.trim()) {
            throw new GradleException('Bitte installerPassword in gradle.properties setzen.')
        }
    }

    from('app')       { into 'app' }
    from('bootstrap') {
        into 'bootstrap'
        exclude 'cache/*.php'
    }
    from('config')    { into 'config' }
    from('database')  {
        into 'database'
        exclude '*.sqlite'
        exclude '*.sqlite-*'
    }
    from('lang')      { into 'lang' }
    from('resources') { into 'resources' }
    from('routes')    { into 'routes' }
    from(runtimeSkeletonDir)

    from('public') {
        into 'public'
        exclude 'install.php'
    }

    from('public/install.php') {
        into 'public'
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: installerTokens)
    }

    from(projectDir) {
        include 'artisan'
        include 'composer.json'
        include 'composer.lock'
    }

    doLast {
        def installer = file("${deployStageDir}/public/install.php")
        def installerText = installer.getText('UTF-8')

        if (installerText.contains("@installerPassword@")) {
            throw new GradleException('Installer-Passwort wurde im Upload-Stand nicht ersetzt.')
        }

        if (installerText.contains("INSTALL_PASSWORD !== INSTALL_PASSWORD")) {
            throw new GradleException('Installer-Prüflogik ist ungültig.')
        }

        println 'Hinweis: .env wird nicht deployed. Der Installer erstellt und pflegt sie auf dem Server.'
    }
}

