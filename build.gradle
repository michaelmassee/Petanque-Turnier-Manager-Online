tasks.register('fetchRemoteLaravelLog') {
    group       = 'deploy'
    description = 'Lädt storage/logs/laravel.log und installer.log vom Deploy-Ziel herunter'

    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('fetchRemoteLaravelLog unterstützt aktuell nur SFTP.')
        }

        ['laravel.log', 'installer.log'].each { logName ->
            def remoteLog = remoteChildPath("storage/logs/${logName}")
            def localLog = layout.buildDirectory.file("remote-logs/${logName}").get().asFile
            println "→ Lade Remote-Log herunter: ${remoteLog}"
            try {
                downloadSftpFile(remoteLog, localLog)
                println "✓ Remote-Log gespeichert: ${localLog}"
            } catch (Exception ex) {
                println "○ Remote-Log nicht vorhanden: ${remoteLog}"
            }
        }
    }
}

tasks.register('clearRemoteLaravelLogs') {
    group       = 'deploy'
    description = 'Löscht alte Laravel-Logdateien auf dem Deploy-Ziel'

    doLast {
        if (deployProtocol == 'ftp') {
            throw new GradleException('clearRemoteLaravelLogs unterstützt aktuell nur SFTP.')
        }

        def logsDir = remoteChildPath('storage/logs')
        def jsch = new JSch()
        def session = jsch.getSession(remoteUser, remoteHost, remotePort)
        session.setPassword(remotePassword)
        session.setConfig('StrictHostKeyChecking', 'no')
        session.connect(30000)

        def channel = (ChannelSftp) session.openChannel('sftp')
        channel.connect(30000)
        try {
            channel.cd('/')
            ensureSftpDirectory(channel, logsDir)
            channel.ls('*.log').each { entry ->
                if (entry instanceof ChannelSftp.LsEntry && !entry.attrs.dir) {
                    channel.rm(entry.filename)
                    println "gelöscht: ${logsDir}/${entry.filename}"
                }
            }
        } finally {
            channel.disconnect()
            session.disconnect()
        }
    }
}

